<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PopCornRevs — Movies, Ratings & Tickets</title>
<meta name="description" content="Discover movies, rate them, save to watchlist and buy tickets online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B0F1A;
  --panel:#141B2D;
  --panel2:#1A2338;
  --line:#2A3655;
  --ink:#F1F4FF;
  --mute:#9AA8C7;
  --y:#FFD21F;
  --y2:#FFC107;
  --radius:16px;
  --shadow:0 20px 50px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  line-height:1.5;
  min-height:100vh;
}
button,input{font:inherit}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

header{
  position:sticky;top:0;z-index:50;
  background:rgba(11,15,26,.92);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:20px;
  padding:12px 4vw;
}
.logo{
  font-weight:900;font-size:1.55rem;letter-spacing:-1.2px;
  cursor:pointer;white-space:nowrap;
}
.logo b{color:var(--y)}
.search{flex:1;max-width:420px;position:relative}
.search input{
  width:100%;padding:11px 18px 11px 42px;
  border-radius:999px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);
  transition:border .2s,box-shadow .2s;
}
.search input:focus{outline:none;border-color:var(--y);box-shadow:0 0 0 3px rgba(255,210,31,.15)}
.search::before{
  content:"🔍";position:absolute;left:14px;top:50%;transform:translateY(-50%);
  font-size:14px;opacity:.7;pointer-events:none;
}
nav{display:flex;gap:4px;margin-left:auto}
nav button{
  background:none;color:var(--mute);border:0;
  padding:9px 14px;border-radius:999px;cursor:pointer;
  font-weight:500;font-size:.9rem;transition:all .2s;
  display:flex;align-items:center;gap:6px;
}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.06)}
nav button.on{color:#1a1500;background:var(--y);font-weight:700}
.badge{
  background:var(--y);color:#1a1500;border-radius:999px;
  font-size:11px;padding:1px 7px;font-weight:700;min-width:18px;text-align:center;
}
nav .on .badge{background:#1a1500;color:var(--y)}

main{padding:28px 4vw 80px;max-width:1320px;margin:0 auto}

.hero{
  display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center;
  padding:36px;border-radius:24px;
  background:linear-gradient(135deg,var(--panel) 0%,#1a1528 100%);
  border:1px solid var(--line);
  position:relative;overflow:hidden;
  box-shadow:var(--shadow);
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(ellipse 80% 60% at 90% 20%,var(--hero-glow,rgba(194,87,26,.25)),transparent 70%);
  pointer-events:none;
}
.hero-content{position:relative;z-index:1}
.tag{
  display:inline-block;color:var(--y);font-weight:700;font-size:.8rem;
  letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px;
}
.hero h1{
  font-size:clamp(2rem,4.5vw,3.4rem);line-height:1.08;
  font-weight:900;letter-spacing:-1.5px;margin-bottom:12px;
}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;color:var(--mute);font-size:.95rem}
.meta .star{color:var(--y);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{
  display:inline-block;padding:5px 12px;border-radius:999px;
  background:rgba(255,255,255,.08);font-size:.8rem;border:1px solid transparent;
  color:var(--ink);
}
button.chip{cursor:pointer;transition:all .2s}
button.chip:hover,button.chip.on{background:var(--y);color:#1a1500;font-weight:600}
.hero p{color:var(--mute);font-size:1.05rem;line-height:1.6;max-width:520px;margin-bottom:22px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{
  cursor:pointer;padding:12px 20px;border-radius:999px;
  border:2px solid var(--y);background:transparent;color:var(--y);
  font-weight:700;font-size:.9rem;transition:all .2s;
  display:inline-flex;align-items:center;gap:8px;
}
.btn:hover{background:rgba(255,210,31,.12);transform:translateY(-1px)}
.btn.fill{background:var(--y);color:#1a1500}
.btn.fill:hover{background:var(--y2);box-shadow:0 8px 24px rgba(255,210,31,.3)}
.btn:focus-visible,.card:focus-visible,nav button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.poster-wrap{
  position:relative;justify-self:center;max-width:280px;width:100%;
}
.poster{
  aspect-ratio:2/3;border-radius:18px;overflow:hidden;
  box-shadow:0 25px 60px rgba(0,0,0,.6);
  background:var(--panel2);
  transition:transform .3s cubic-bezier(.2,.8,.2,1);
}
.poster img{
  width:100%;height:100%;object-fit:cover;
}
.hero .poster{transform:rotate(2.5deg)}
.hero .poster:hover{transform:rotate(0) scale(1.03)}

h2.sec{
  font-size:1.55rem;font-weight:800;margin:48px 0 18px;
  letter-spacing:-.5px;
}
.row{
  display:grid;grid-template-columns:repeat(4,1fr);gap:20px;
}
.grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:20px;
}
.card{
  background:none;border:0;color:inherit;text-align:left;cursor:pointer;padding:0;
  transition:transform .2s;
}
.card:hover{transform:translateY(-6px)}
.card:hover .poster{box-shadow:0 20px 40px rgba(0,0,0,.5)}
.card h4{margin:12px 0 4px;font-size:.95rem;font-weight:700;line-height:1.25}
.card p{margin:0;color:var(--mute);font-size:.85rem}
.star{color:var(--y)}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:48px}
.tile{
  background:var(--panel);border:1px solid var(--line);
  border-radius:20px;padding:24px;transition:border .2s;
}
.tile:hover{border-color:var(--y)}
.tile .ico{font-size:2rem;margin-bottom:10px}
.tile h3{font-size:1.1rem;margin-bottom:6px}
.tile p{color:var(--mute);font-size:.9rem}

#modal{
  position:fixed;inset:0;background:rgba(0,0,0,.8);
  display:none;place-items:center;z-index:100;padding:16px;
  backdrop-filter:blur(8px);
}
#modal.open{display:grid}
.box{
  background:var(--panel);border:1px solid var(--line);
  border-radius:22px;padding:28px;max-width:720px;width:100%;
  max-height:92vh;overflow:auto;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  animation:pop .25s ease;
}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.box h3{margin:0 0 16px;font-size:1.35rem;font-weight:800}
.player{
  aspect-ratio:16/9;background:#000;border-radius:14px;
  overflow:hidden;margin-bottom:16px;position:relative;
}
.player iframe{width:100%;height:100%;border:0;position:absolute;inset:0}
.seats{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:12px 0}
.seat{
  padding:10px 0;border-radius:8px;border:0;
  background:var(--line);color:var(--ink);cursor:pointer;font-size:12px;
  transition:all .15s;
}
.seat:hover:not(.t):not(.s){background:#3a4a70}
.seat.t{background:#080E24;color:#3b4670;cursor:not-allowed}
.seat.s{background:var(--y);color:#1a1500;font-weight:700}
.scr{height:5px;border-radius:50%;background:var(--y);margin:14px 14% 8px;opacity:.8}
.stars{text-align:center;margin:12px 0}
.stars button{
  font-size:42px;background:none;border:0;color:#3a4568;
  cursor:pointer;transition:color .15s,transform .15s;
}
.stars button:hover{transform:scale(1.15)}
.stars .on{color:var(--y)}

.tk{
  display:flex;gap:16px;align-items:center;
  background:var(--panel);border:2px dashed var(--y);
  border-radius:16px;padding:16px;margin-bottom:14px;
}
.tk .poster{width:72px;flex:none;border-radius:10px;box-shadow:none}
.tk .poster img{border-radius:10px}
.tk p{margin:3px 0;color:var(--mute);font-size:.9rem}
.tk b{font-size:1.1rem}
.empty{color:var(--mute);font-size:1.05rem;padding:40px 0;text-align:center}

@media(max-width:820px){
  header{flex-wrap:wrap;gap:10px;padding:10px 3.5vw}
  .search{order:3;flex-basis:100%;max-width:none}
  nav{
    position:fixed;left:0;right:0;bottom:0;margin:0;
    background:var(--panel);border-top:1px solid var(--line);
    justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom,0px));
    z-index:60;
  }
  nav button{padding:8px 8px;font-size:.78rem;flex-direction:column;gap:2px}
  .hero{grid-template-columns:1fr;padding:22px;gap:22px}
  .hero .poster-wrap{max-width:200px;order:-1;margin:0 auto}
  .hero .poster{transform:none}
  .row{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:145px;overflow-x:auto;padding-bottom:10px;gap:14px}
  .tiles{grid-template-columns:1fr}
  main{padding:18px 3.5vw 110px}
  .box{padding:20px;max-width:100%}
}
</style>
</head>
<body>
<header>
  <div class="logo" onclick="go('home')">PopCorn<b>Revs</b></div>
  <div class="search">
    <input id="q" placeholder="Search movies, genres..." oninput="S.q=this.value;go('movies')" aria-label="Search movies">
  </div>
  <nav id="nav"></nav>
</header>

<main id="main"></main>

<div id="modal" onclick="if(event.target===this)closeM()">
  <div class="box" id="box"></div>
</div>

<script>
/* ========== MOVIE DATA (verified posters + trailers) ========== */
const M = [
  {
    id:1, t:"Dune: Part Two",
    g:["Sci-Fi","Adventure"], r:8.8, v:412,
    img:"https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg",
    trailer:"Way9Dexny3w",
    a:"#C2571A", p:12,
    d:"Paul Atreides unites with Chani and the Fremen while on a path of revenge against the conspirators who destroyed his family. Facing a choice between the love of his life and the fate of the known universe."
  },
  {
    id:2, t:"Deadpool & Wolverine",
    g:["Action","Comedy"], r:8.5, v:356,
    img:"https://image.tmdb.org/t/p/w500/8cdWjvZQUExUUTzyp4t6EDMubfO.jpg",
    trailer:"73_1biulkYk",
    a:"#D0192B", p:11,
    d:"Wade Wilson teams up with a reluctant Wolverine in an adventure that features the most unlikely of friendships, lots of action and plenty of meta humor."
  },
  {
    id:3, t:"Interstellar",
    g:["Sci-Fi","Drama"], r:8.7, v:623,
    img:"https://image.tmdb.org/t/p/w500/rAiYTfKGqDCRIIqo664sY9XZIvQ.jpg",
    trailer:"zSWdZVtXT7E",
    a:"#6A9BC8", p:10,
    d:"A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival as Earth becomes uninhabitable."
  },
  {
    id:4, t:"The Batman",
    g:["Action","Crime"], r:7.8, v:489,
    img:"https://image.tmdb.org/t/p/w500/74xTEgt7R36Fpooo50r9T25onhq.jpg",
    trailer:"mqqft2x_Aa4",
    a:"#9A4317", p:11,
    d:"In his second year of fighting crime, Batman uncovers corruption in Gotham City that connects to his own family while facing a serial killer known as the Riddler."
  },
  {
    id:5, t:"The Dark Knight",
    g:["Action","Crime"], r:9.0, v:701,
    img:"https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
    trailer:"EXeTwQWrcwY",
    a:"#3A4C86", p:10,
    d:"Batman, Gordon and Harvey Dent are forced to deal with the chaos unleashed by an anarchist mastermind known only as the Joker, as he pushes Gotham into anarchy."
  },
  {
    id:6, t:"Forrest Gump",
    g:["Drama"], r:8.8, v:540,
    img:"https://image.tmdb.org/t/p/w500/saHP97rTPS5eLmrLQEcANmKrsFl.jpg",
    trailer:"bLvqoHBptjg",
    a:"#8FB3D9", p:9,
    d:"The presidencies of Kennedy and Johnson, Vietnam, Watergate, and other history unfold through the perspective of an Alabama man with an IQ of 75."
  },
  {
    id:7, t:"Inception",
    g:["Sci-Fi","Action"], r:8.8, v:642,
    img:"https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",
    trailer:"YoHD9XEInc0",
    a:"#4A5C96", p:10,
    d:"A thief who steals corporate secrets through dream-sharing technology is given the inverse task of planting an idea into the mind of a C.E.O."
  },
  {
    id:8, t:"Coco",
    g:["Animation","Drama"], r:8.4, v:290,
    img:"https://image.tmdb.org/t/p/w500/gGEsBPAijhVUFoiNpgZXqRVWJt2.jpg",
    trailer:"xlnPHQ3TLX8",
    a:"#F28C28", p:9,
    d:"Aspiring musician Miguel, confronted with his family's ancestral ban on music, enters the Land of the Dead to find his great-great-grandfather, a legendary singer."
  }
];

const G = ["All","Action","Sci-Fi","Comedy","Drama","Animation"];

let S = {v:"home", f:1, q:"", g:"All", w:[], t:[]};
let U = {};
let B = {};
let booked = {};
const baseTaken = ["A3","A4","B6","C2","C5","D7","E1","E8"];

function mv(i){ return M.find(m => m.id === i); }
function rate(m){
  if(U[m.id]) return ((m.r * m.v + U[m.id]) / (m.v + 1)).toFixed(1);
  return m.r.toFixed(1);
}
function pos(m){
  return `<div class="poster">
    <img src="${m.img}" alt="${m.t}" loading="lazy"
         onerror="this.onerror=null;this.src='https://placehold.co/300x450/1a2338/9aa8c7?text=${encodeURIComponent(m.t)}'">
  </div>`;
}
function card(m){
  return `<button class="card" onclick="feat(${m.id})">
    ${pos(m)}
    <h4>${m.t}</h4>
    <p><span class="star">★</span> ${rate(m)} <small>(${m.v}K)</small></p>
  </button>`;
}

function go(v){ S.v = v; render(); window.scrollTo(0,0); }
function feat(i){ S.f = i; S.v = "home"; render(); window.scrollTo(0,0); }
function toggleW(i){
  const k = S.w.indexOf(i);
  if(k > -1) S.w.splice(k,1); else S.w.push(i);
  render();
}

function nav(){
  const L = [
    ["home","🏠","Home"],
    ["movies","🎞️","Movies"],
    ["watch","🔖","Watchlist", S.w.length],
    ["tix","🎟️","Tickets", S.t.length]
  ];
  document.getElementById("nav").innerHTML = L.map(x =>
    `<button class="${S.v===x[0]?'on':''}" onclick="go('${x[0]}')">
      <span>${x[1]}</span><span>${x[2]}</span>
      ${x[3] ? `<span class="badge">${x[3]}</span>` : ''}
    </button>`
  ).join("");
}

function render(){
  nav();
  let h = "";
  const m = mv(S.f);

  if(S.v === "home"){
    const inW = S.w.includes(m.id);
    h += `<section class="hero" style="--hero-glow:${m.a}44">
      <div class="hero-content">
        <span class="tag">Featured tonight</span>
        <h1>${m.t}</h1>
        <div class="meta">
          <span class="star">★ ${rate(m)}</span>
          <span>·</span>
          <span>${m.v}K ratings</span>
        </div>
        <div class="chips">${m.g.map(g => `<span class="chip">${g}</span>`).join("")}</div>
        <p>${m.d}</p>
        <div class="btns">
          <button class="btn" onclick="trailer()">▶ Watch Trailer</button>
          <button class="btn" onclick="rateM()">★ Rate Movie</button>
          <button class="btn" onclick="toggleW(${m.id})">${inW ? '✓ In Watchlist' : '+ Watchlist'}</button>
          <button class="btn fill" onclick="book()">🎟️ Buy Tickets</button>
        </div>
      </div>
      <div class="poster-wrap">${pos(m)}</div>
    </section>`;

    h += `<h2 class="sec">Popular Now</h2>
          <div class="row">${M.slice(0,4).map(card).join("")}</div>`;

    h += `<h2 class="sec">Top Rated</h2>
          <div class="row">${[...M].sort((a,b)=>b.r-a.r).slice(0,4).map(card).join("")}</div>`;

    h += `<div class="tiles">
      <div class="tile"><div class="ico">🎟️</div><h3>Buy tickets online</h3><p>Choose a time and your seats. No lines, no stress.</p></div>
      <div class="tile"><div class="ico">⭐</div><h3>Rate and save</h3><p>Give stars to movies and keep your favorites in a watchlist.</p></div>
      <div class="tile"><div class="ico">🔎</div><h3>Find movies fast</h3><p>Search by name or use the genre buttons.</p></div>
    </div>`;
  }
  else if(S.v === "movies"){
    const q = S.q.toLowerCase();
    const L = M.filter(x =>
      (S.g === "All" || x.g.includes(S.g)) &&
      (x.t.toLowerCase().includes(q) || x.g.join(" ").toLowerCase().includes(q))
    );
    h += `<h2 class="sec" style="margin-top:8px">All Movies</h2>
          <div class="chips" style="margin-bottom:18px">
            ${G.map(g => `<button class="chip ${S.g===g?'on':''}" onclick="S.g='${g}';render()">${g}</button>`).join("")}
          </div>
          <div class="grid">
            ${L.length ? L.map(card).join("") : '<p class="empty">No movies found. Try another word.</p>'}
          </div>`;
  }
  else if(S.v === "watch"){
    h += `<h2 class="sec" style="margin-top:8px">My Watchlist</h2>
          ${S.w.length
            ? `<div class="grid">${S.w.map(i => card(mv(i))).join("")}</div>`
            : `<p class="empty">Your watchlist is empty.<br>Open a movie and press "+ Watchlist".</p>`}`;
  }
  else {
    h += `<h2 class="sec" style="margin-top:8px">My Tickets</h2>
          ${S.t.length
            ? S.t.map(k => {
                const x = mv(k.m);
                return `<div class="tk">
                  ${pos(x)}
                  <div>
                    <b>${x.t}</b>
                    <p>${k.d} · ${k.h}</p>
                    <p>Seats: ${k.s.join(", ")} · Total: $${k.tot}</p>
                    <p style="color:var(--y);font-weight:600">Code: ${k.c} ✔ Confirmed</p>
                  </div>
                </div>`;
              }).join("")
            : `<p class="empty">You have no tickets yet.<br>Pick a movie and press "Buy Tickets".</p>`}`;
  }

  document.getElementById("main").innerHTML = h;
}

function openM(html){
  document.getElementById("box").innerHTML = html;
  document.getElementById("modal").className = "open";
  document.body.style.overflow = "hidden";
}
function closeM(){
  document.getElementById("modal").className = "";
  document.body.style.overflow = "";
  // stop any playing trailer when closing
  const box = document.getElementById("box");
  if(box) box.innerHTML = "";
}
document.addEventListener("keydown", e => { if(e.key === "Escape") closeM(); });

function closeBtn(){
  return `<div class="btns" style="margin-top:18px"><button class="btn" onclick="closeM()">Close</button></div>`;
}

/* ========== TRAILER (embedded inside the page) ========== */
function trailer(){
  const m = mv(S.f);
  const embedUrl = "https://www.youtube.com/embed/" + m.trailer + "?autoplay=1&rel=0&modestbranding=1";
  openM(
    '<h3>Trailer — ' + m.t + '</h3>' +
    '<div class="player">' +
      '<iframe src="' + embedUrl + '" ' +
        'title="Trailer of ' + m.t + '" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" ' +
        'allowfullscreen ' +
        'referrerpolicy="strict-origin-when-cross-origin">' +
      '</iframe>' +
    '</div>' +
    '<div class="btns" style="margin-top:16px">' +
      '<button class="btn" onclick="closeM()">Close</button>' +
    '</div>'
  );
}

function rateM(){
  const m = mv(S.f);
  openM(`
    <h3>Rate — ${m.t}</h3>
    <div class="stars">
      ${[1,2,3,4,5].map(n =>
        `<button class="${(U[m.id]||0)>=n?'on':''}" onclick="setR(${n})" aria-label="${n} stars">★</button>`
      ).join("")}
    </div>
    <p style="text-align:center;color:var(--mute)">
      ${U[m.id] ? `You gave it ${U[m.id]} stars. Thank you!` : "Tap a star to rate this movie."}
    </p>
    ${closeBtn()}
  `);
}
function setR(n){ U[S.f] = n; rateM(); render(); }

function book(){ B = {d:"Today", h:"7:30 PM", s:[]}; bookM(); }
function taken(){ return baseTaken.concat(booked[S.f + B.d + B.h] || []); }

function bookM(){
  const m = mv(S.f);
  const tk = taken();
  let seats = "";
  "ABCDE".split("").forEach(r => {
    for(let c=1; c<=8; c++){
      const id = r + c;
      const cls = tk.includes(id) ? "t" : (B.s.includes(id) ? "s" : "");
      seats += `<button class="seat ${cls}" onclick="pick('${id}')">${id}</button>`;
    }
  });

  const chips = (arr, key) => arr.map(x =>
    `<button class="chip ${B[key]===x?'on':''}" onclick="B.${key}='${x}';B.s=[];bookM()">${x}</button>`
  ).join("");

  openM(`
    <h3>🎟️ ${m.t}</h3>
    <div class="chips" style="margin-bottom:10px">${chips(["Today","Tomorrow","Saturday"],"d")}</div>
    <div class="chips">${chips(["4:00 PM","7:30 PM","10:00 PM"],"h")}</div>
    <div class="scr"></div>
    <p style="text-align:center;color:var(--mute);margin:0 0 10px;font-size:.85rem">Screen</p>
    <div class="seats">${seats}</div>
    <p style="color:var(--mute);font-size:.9rem;margin-top:12px">
      Yellow = your seats · Dark = taken · $${m.p} each
    </p>
    <p style="margin:8px 0 16px"><b>Total: $${B.s.length * m.p}</b>
      ${B.s.length ? ` (${B.s.join(", ")})` : ""}
    </p>
    <div class="btns">
      <button class="btn" onclick="closeM()">Cancel</button>
      ${B.s.length ? `<button class="btn fill" onclick="buy()">Confirm purchase</button>` : ""}
    </div>
  `);
}

function pick(id){
  if(taken().includes(id)) return;
  const k = B.s.indexOf(id);
  if(k > -1) B.s.splice(k,1); else B.s.push(id);
  bookM();
}

function buy(){
  const m = mv(S.f);
  const key = S.f + B.d + B.h;
  booked[key] = (booked[key] || []).concat(B.s);
  S.t.push({
    m: m.id, d: B.d, h: B.h,
    s: B.s.slice().sort(),
    tot: B.s.length * m.p,
    c: "PCR-" + (1000 + Math.floor(Math.random()*9000))
  });
  closeM();
  go("tix");
}

render();
</script>
</body>
</html>
